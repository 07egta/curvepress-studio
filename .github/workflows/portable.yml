name: Windows portable app

on:
  workflow_dispatch:
  push:
    branches: [main, 'finish/**']
    paths:
      - 'curvepress/**'
      - 'launcher/desktop.py'
      - 'scripts/build_portable.py'
      - 'pyproject.toml'
      - '.github/workflows/portable.yml'
  pull_request:
    paths:
      - 'launcher/desktop.py'
      - 'scripts/build_portable.py'
      - '.github/workflows/portable.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[cad]' pyinstaller
      - name: Build and test the frozen CAD application
        run: python scripts/build_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: CurvePress-Studio-Windows
          path: dist/CurvePress-Studio-Windows.zip
          retention-days: 30
