name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check curvepress tests

  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1
      - run: pip install -e '.[cad,dev]'
      - name: Require a working CAD runtime (no skipped CAD tests)
        run: python -c "from curvepress.exporter import _load_occ; _load_occ()"
      - run: python -m pytest tests/test_exporter.py tests/test_reliability.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check bundled UI and sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              assert 'curvepress/static/index.html' in archive.namelist()
              assert 'curvepress/static/examples/hokusai-great-wave.jpg' in archive.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: curvepress-python-package
          path: dist/*
