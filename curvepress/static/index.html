<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CurvePress Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d3f6e'/%3E%3Cpath d='M6 22c5-11 9 3 13-5 3-5 5-1 7-5' fill='none' stroke='%23f4f5f3' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M5 26h9M27 26V20' stroke='%23e0524b' stroke-width='2.2' stroke-linecap='square'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#eceeeb;      /* studio workbench */
  --panel:#ffffff;
  --sumi:#26282b;        /* ink text */
  --muted:#686d71;
  --line:#d6d9d5;
  --ai:#1d3f6e;          /* Prussian blue (bero-ai) — actions */
  --ai-soft:#e3e9f1;
  --table:#14263f;       /* printing table */
  --table-edge:#0e1b2e;
  --beni:#c23b33;        /* kento red — marks and problems only */
  --ok:#2f6b4f;
  --washi:#f6f2e7;
  --radius-s:6px;--radius-m:10px;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Source Han Serif JP","Songti SC",serif;
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#16181b;--panel:#1f2226;--sumi:#e9e7e1;--muted:#a1a4a6;--line:#33373c;
  --ai:#8fb0dd;--ai-soft:#22324a;--table:#0f1d31;--table-edge:#0a1424;--beni:#e0645b;--ok:#7fc3a0;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--sumi);font:15px/1.6 var(--gothic);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:minmax(300px,368px) 1fr;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:600 21px/1 var(--mincho);letter-spacing:.02em;margin:0}
.brand span{color:var(--muted);font-size:13px}
.local{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.local svg{flex:none}
.langs{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.langs button{border:0;background:none;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.langs button[aria-pressed=true]{background:var(--sumi);color:var(--panel)}

/* ---------- controls ---------- */
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.scroll{overflow:auto;flex:1;padding:6px 20px 12px}
.savebar{border-top:1px solid var(--line);padding:2px 20px 16px;background:var(--panel);box-shadow:0 -8px 18px -14px rgba(0,0,0,.25);max-height:46vh;overflow:auto}
.savebar .step{border:0;padding-bottom:4px}
.step{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font:600 17px/1.3 var(--mincho)}
.step h2 b{font:500 22px/1 var(--mincho);color:var(--ai);min-width:14px}
.step h2 small{margin-left:auto;font:12px var(--gothic);color:var(--muted)}

.drop{position:relative;border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:16px;display:flex;gap:14px;align-items:center;transition:border-color .15s,background .15s}
.drop.drag{border-color:var(--ai);background:var(--ai-soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .thumb{width:64px;height:48px;border-radius:4px;background:var(--ground) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted)}
.drop strong{display:block;font-weight:600;font-size:14px}
.drop small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.samples{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.samples button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;display:flex;align-items:center;gap:7px;font-size:12.5px}
.samples img{width:26px;height:26px;border-radius:50%;object-fit:cover}

.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.style{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-m);padding:10px 10px 10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;transition:border-color .15s,box-shadow .15s}
.style b{font-weight:600;font-size:14px}
.style small{grid-column:1;color:var(--muted);font-size:11.5px;line-height:1.35}
.style svg{grid-row:1/3;grid-column:2;width:38px;height:30px;color:var(--muted)}
.style[aria-checked=true]{border-color:var(--ai);box-shadow:inset 0 0 0 1px var(--ai)}
.style[aria-checked=true] svg{color:var(--ai)}
.style.wide{grid-column:1/-1}
.sub{margin-top:12px}

.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-s);padding:7px 9px;color:var(--sumi);font-size:14px;font-variant-numeric:tabular-nums}
.size{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.swap{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-s);width:34px;height:36px;display:grid;place-items:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.chips button[aria-pressed=true]{border-color:var(--ai);color:var(--ai)}
.thick{margin-top:10px;font-size:12.5px;color:var(--muted)}
.thick b{color:var(--sumi);font-weight:600;font-variant-numeric:tabular-nums}
.range{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12.5px;color:var(--muted)}
.range input{grid-column:1/-1;width:100%;accent-color:var(--ai)}
.range output{color:var(--sumi);font-variant-numeric:tabular-nums}

details{margin-top:14px;border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 0 2px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
.more{display:grid;gap:12px;padding-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--ai);width:16px;height:16px}

.files{display:grid;gap:6px}
.plate-row{display:grid;grid-template-columns:14px 3.6em 1fr;gap:8px;align-items:center}
.swatch{width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.plate-row .name{font-size:13px;font-weight:600}
.plate-row .links{display:flex;gap:6px;flex-wrap:wrap}
.plate-row.all .links{grid-column:1/-1}
.dl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 10px;font-size:12.5px;color:var(--sumi);text-decoration:none;background:var(--panel)}
.dl:hover{border-color:var(--ai);color:var(--ai)}
.dl svg{width:12px;height:12px}
.primary{width:100%;border:0;border-radius:var(--radius-m);background:var(--ai);color:#fff;padding:11px 14px;font-weight:600;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px}
@media (prefers-color-scheme:dark){.primary{color:#0f1d31}}
.primary:disabled{opacity:.45;cursor:default}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.empty-note{font-size:13px;color:var(--muted);margin:0}

/* ---------- stage (the printing table) ---------- */
main{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0;background:var(--ground)}
.toolbar{display:flex;align-items:center;gap:12px;padding:12px 20px}
.views{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:3px}
.views button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;color:var(--muted)}
.views button[aria-selected=true]{background:var(--sumi);color:var(--panel)}
.views button:disabled{opacity:.35;cursor:default}
.status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.error{color:var(--beni)}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ai);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.stage{position:relative;margin:0 20px;border-radius:14px;overflow:hidden;container-type:size;
  background:radial-gradient(120% 90% at 50% 40%,var(--table) 0%,var(--table-edge) 100%);min-height:300px}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(calc(100cqw - 64px),calc((100cqh - 64px) * var(--ar,1.5)));aspect-ratio:var(--ar,1.5);
  box-shadow:0 1px 0 rgba(255,255,255,.04),0 18px 40px rgba(0,0,0,.45);background:var(--washi);transition:opacity .25s}
.sheet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.stage.busy .sheet{opacity:.72}
.peel-top{clip-path:inset(0 0 0 var(--peel,50%))}
.peel{position:absolute;top:-10px;bottom:-10px;left:var(--peel,50%);width:44px;margin-left:-22px;cursor:ew-resize;touch-action:none;display:flex;justify-content:center}
.peel::before{content:"";width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.18),6px 0 14px rgba(0,0,0,.25)}
.peel i{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--table)}
.peel-label{position:absolute;bottom:10px;font-size:11.5px;color:#fff;background:rgba(10,20,36,.62);padding:2px 8px;border-radius:999px;pointer-events:none}
.peel-label.l{left:10px}.peel-label.r{right:10px}
#plate3d{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#plate3d:active{cursor:grabbing}
.stage-tools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px}
.stage-tools button{border:0;border-radius:999px;padding:4px 11px;font-size:12px;background:rgba(255,255,255,.14);color:#eef2f7;display:flex;align-items:center;gap:6px}
.stage-tools button[aria-pressed=true]{background:#f4f5f3;color:var(--table)}
.stage-tools i{width:9px;height:9px;border-radius:50%;display:inline-block}
.welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#c9d3e0;padding:24px}
.welcome h3{font:600 26px/1.4 var(--mincho);color:#f4f5f3;margin:0 0 6px;letter-spacing:.02em}
.welcome p{margin:0 auto;max-width:34em;font-size:14px}
.welcome .kento{display:block;margin:0 auto 18px}
.caption{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:#c9d3e0;opacity:.85}

.facts{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 20px 16px;font-size:12.5px;color:var(--muted);align-items:baseline}
.facts b{color:var(--sumi);font-weight:600;font-variant-numeric:tabular-nums;margin-left:4px}
.notes{flex-basis:100%;display:grid;gap:4px}
.note{display:flex;gap:8px;align-items:baseline;color:var(--sumi);font-size:12.5px}
.note::before{content:"";width:7px;height:7px;flex:none;border:1.5px solid var(--beni);border-top:0;border-right:0;transform:translateY(-1px)}

@media (max-width:900px){
  aside{display:block}.scroll{overflow:visible}.savebar{max-height:none;box-shadow:none}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
  main{order:-1;grid-row:2}
  aside{grid-row:3;border-right:0}
  .stage{height:auto;aspect-ratio:4/3;min-height:240px;max-height:70vh;margin:0 12px}
  .welcome h3{font-size:20px}.welcome p{font-size:13px}
  .toolbar{padding:10px 12px;flex-wrap:wrap}.facts{padding:10px 12px}
  header{padding:10px 12px;flex-wrap:wrap}.local{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>CurvePress Studio</h1><span data-t="tagline"></span></div>
    <div class="local"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg><span data-t="local"></span></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">中文</button>
    </div>
  </header>

  <aside>
   <div class="scroll">
    <section class="step">
      <h2><b>1</b><span data-t="s1"></span></h2>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*,.svg" aria-describedby="fileHint">
        <span class="thumb" id="thumb"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 13V3M6 7l4-4 4 4M3 14v3h14v-3"/></svg></span>
        <span><strong id="fileTitle" data-t="drop"></strong><small id="fileHint" data-t="dropHint"></small></span>
      </label>
      <div class="samples"><span data-t="tryWith"></span>
        <button type="button" id="sample"><img src="/examples/hokusai-great-wave.jpg" alt=""><span data-t="sampleName"></span></button>
      </div>
    </section>

    <section class="step">
      <h2><b>2</b><span data-t="s2"></span></h2>
      <div class="styles" role="radiogroup" id="styles">
        <button class="style" role="radio" data-style="woodcut"><b data-t="woodcut"></b><small data-t="woodcutHint"></small>
          <svg viewBox="0 0 38 30" fill="none"><path d="M3 24 13 9l6 7 5-5 11 13z" fill="currentColor" opacity=".25"/><path d="m3 24 10-15 6 7 5-5 11 13M3 27h32" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
        <button class="style" role="radio" data-style="line_art"><b data-t="lineArt"></b><small data-t="lineArtHint"></small>
          <svg viewBox="0 0 38 30" fill="none"><path d="M3 21c6-13 9 4 15-6 4-8 7 1 16-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 26c8-4 14 2 28-3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
        <button class="style" role="radio" data-style="halftone"><b data-t="halftone"></b><small data-t="halftoneHint"></small>
          <svg viewBox="0 0 38 30" fill="currentColor"><circle cx="6" cy="6" r="3"/><circle cx="15" cy="6" r="2.2"/><circle cx="24" cy="6" r="1.5"/><circle cx="33" cy="6" r=".9"/><circle cx="6" cy="15" r="2.4"/><circle cx="15" cy="15" r="1.7"/><circle cx="24" cy="15" r="1.1"/><circle cx="33" cy="15" r=".6"/><circle cx="6" cy="24" r="1.7"/><circle cx="15" cy="24" r="1.2"/><circle cx="24" cy="24" r=".8"/><circle cx="33" cy="24" r=".45"/></svg></button>
        <button class="style" role="radio" data-style="poster"><b data-t="poster"></b><small data-t="posterHint"></small>
          <svg viewBox="0 0 38 30" fill="none"><path d="M4 26V12l8-7 7 6 6-4 9 7v12z" fill="currentColor"/><circle cx="27" cy="9" r="0"/></svg></button>
        <button class="style wide" role="radio" data-style="color_layers"><b data-t="color"></b><small data-t="colorHint"></small>
          <svg viewBox="0 0 38 30" fill="none"><rect x="2" y="9" width="17" height="14" rx="1" fill="#2c5a8c" opacity=".85"/><rect x="11" y="5" width="17" height="14" rx="1" fill="#d6a24a" opacity=".85"/><rect x="19" y="11" width="17" height="14" rx="1" fill="#26282b" opacity=".75"/></svg></button>
      </div>
      <div class="sub range hidden" id="colorsWrap"><label for="colors" data-t="colors"></label><output id="colorsOut"></output><input id="colors" type="range" min="2" max="6" value="4"></div>
      <div class="sub range hidden" id="trapWrap"><label for="trap" data-t="trap"></label><output id="trapOut"></output><input id="trap" type="range" min="0" max="0.5" step="0.05" value="0.2"></div>
      <div class="sub range hidden" id="pitchWrap"><label for="pitch" data-t="pitch"></label><output id="pitchOut"></output><input id="pitch" type="range" min="1.2" max="4" step="0.1" value="1.7"></div>
    </section>

    <section class="step">
      <h2><b>3</b><span data-t="s3"></span><small data-t="mm"></small></h2>
      <div class="size">
        <label class="field"><span data-t="width"></span><input id="width" type="number" min="20" max="256" step="1" value="139" inputmode="numeric"></label>
        <button class="swap" type="button" id="swap" data-t-title="swap"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10l-3-3M13 11H3l3 3"/></svg></button>
        <label class="field"><span data-t="height"></span><input id="height" type="number" min="20" max="256" step="1" value="83" inputmode="numeric"></label>
      </div>
      <div class="chips" id="sizes">
        <button data-w="139" data-h="83" data-t="sizeDefault"></button>
        <button data-w="148" data-h="100" data-t="sizePostcard"></button>
        <button data-w="91" data-h="55" data-t="sizeCard"></button>
        <button data-w="120" data-h="120" data-t="sizeSquare"></button>
        <button data-w="180" data-h="180" data-t="sizeBed"></button>
      </div>
      <p class="thick" id="thick"></p>
      <label class="field"><span data-t="bed"></span><select id="bed"><option value="0" data-t="bedOff"></option><option value="180">A1 mini · 180</option><option value="220">220 mm</option><option value="256">A1 / X1 / P1 · 256</option></select></label>
      <details>
        <summary data-t="more"></summary>
        <div class="more">
          <div class="grid2">
            <label class="field"><span data-t="nozzle"></span><select id="nozzle"><option>0.2</option><option selected>0.4</option><option>0.6</option><option>0.8</option></select></label>
            <label class="field"><span data-t="layer"></span><select id="layer"><option>0.12</option><option>0.16</option><option selected>0.20</option><option>0.24</option><option>0.28</option></select></label>
            <label class="field"><span data-t="base"></span><input id="base" placeholder="auto" inputmode="decimal"></label>
            <label class="field"><span data-t="relief"></span><input id="relief" placeholder="auto" inputmode="decimal"></label>
          </div>
          <div class="range"><label for="detail" data-t="detail"></label><output id="detailOut"></output><input id="detail" type="range" min="0" max="100" value="68"></div>
          <div class="range"><label for="contrast" data-t="contrast"></label><output id="contrastOut"></output><input id="contrast" type="range" min="0" max="100" value="55"></div>
          <label class="check"><input type="checkbox" id="mirror" checked><span data-t="mirror"></span></label>
          <label class="check"><input type="checkbox" id="kento" checked><span data-t="kento"></span></label>
          <label class="check"><input type="checkbox" id="frame" checked><span data-t="frame"></span></label>
          <label class="check"><input type="checkbox" id="invert"><span data-t="invert"></span></label>
          <p class="hint"><a class="dl" id="testPlate" href="/api/testplate.zip" download="curvepress_test_plate.zip"><span data-t="testPlate"></span></a></p>
          <p class="hint" data-t="testPlateHint"></p>
        </div>
      </details>
    </section>
   </div>
   <div class="savebar">
    <section class="step">
      <h2><b>4</b><span data-t="s4"></span></h2>
      <p class="empty-note" id="filesEmpty" data-t="filesEmpty"></p>
      <div class="files hidden" id="files"></div>
      <div class="sub hidden" id="stepBox">
        <button class="primary" id="makeStep" type="button"><span data-t="makeStep"></span></button>
        <p class="hint" id="stepHint" data-t="stepHint"></p>
        <div class="files" id="stepFiles"></div>
      </div>
    </section>
   </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="views" role="tablist" id="views">
        <button role="tab" data-view="compare" data-t="vCompare"></button>
        <button role="tab" data-view="plate3d" data-t="vPlate"></button>
        <button role="tab" data-view="curves" data-t="vCurves"></button>
        <button role="tab" data-view="corrected" data-t="vCorrected"></button>
      </div>

/* ---------- state ---------- */
const S={image:null,imageId:null,fileName:'',style:'woodcut',data:null,view:'compare',seq:0,timer:0,busy:false,status:null,step:null,peel:50};

function setStatus(key,kind='',vars={}){S.status={key,kind,vars};renderStatus()}
function renderStatus(){const el=$('#status');if(!S.status){el.innerHTML='<span></span>';return}
  const {key,kind,vars}=S.status;el.className='status '+(kind==='error'?'error':'');
  el.innerHTML=(kind==='busy'?'<i class="spinner"></i>':'')+'<span></span>';el.lastChild.textContent=t(key,vars)}

function applyLang(next){lang=next;store.set('cp-lang',lang);document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  $$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));$$('[data-t-title]').forEach(el=>{el.title=t(el.dataset.tTitle);el.setAttribute('aria-label',el.title)});
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  if(S.fileName){$('#fileTitle').textContent=S.fileName;$('#fileHint').textContent=t('change')}
  renderStatus();renderThickness();renderOutputs();if(S.data){renderFacts();renderFiles();renderStep()}renderView()}

/* ---------- settings ---------- */
const num=(id)=>Number($('#'+id).value);
function config(){return{style:S.style,width_mm:num('width'),height_mm:num('height'),nozzle_mm:num('nozzle'),layer_height_mm:num('layer'),
  base_height_mm:$('#base').value.trim()?Number($('#base').value):null,relief_height_mm:$('#relief').value.trim()?Number($('#relief').value):null,
  detail:num('detail')/100,contrast:num('contrast')/100,color_count:num('colors'),trap_mm:num('trap'),bed_mm:num('bed'),halftone_pitch_mm:num('pitch'),
  halftone_max_dot_mm:Math.min(1.6,num('pitch')*0.94),mirror_for_print:$('#mirror').checked,registration_marks:$('#kento').checked,
  remove_scan_frame:$('#frame').checked,invert:$('#invert').checked,title:(S.fileName||'curvepress_plate').replace(/\.[^.]+$/,'')}}
function auto(){const n=num('nozzle'),l=num('layer'),r=v=>Math.max(l,Math.round(v/l)*l);
  const b=$('#base').value.trim()?Number($('#base').value):r(Math.max(.8,n*2)),h=$('#relief').value.trim()?Number($('#relief').value):r(Math.max(1,n*3));return{b,h}}
function renderThickness(){const {b,h}=auto();$('#thick').textContent=t('thick',{t:(b+h).toFixed(1),b:b.toFixed(1),r:h.toFixed(1)});
  $$('#sizes button').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.w)===num('width')&&Number(x.dataset.h)===num('height')))}

  $('#detailOut').textContent=$('#detail').value+'%';$('#contrastOut').textContent=$('#contrast').value+'%';
  $('#colorsWrap').classList.toggle('hidden',S.style!=='color_layers');$('#trapWrap').classList.toggle('hidden',S.style!=='color_layers');$('#pitchWrap').classList.toggle('hidden',S.style!=='halftone');
  $$('#styles .style').forEach(b=>{b.setAttribute('aria-checked',b.dataset.style===S.style);b.tabIndex=b.dataset.style===S.style?0:-1})}

/* ---------- image input ---------- */
async function readImage(file){
  if(file.size>30*1024*1024)throw Error(t('tooLarge'));
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;try{await img.decode()}catch{throw Error(t('notImage'))}
    const max=2400,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*sc));c.height=Math.max(1,Math.round(img.naturalHeight*sc));
    const x=c.getContext('2d',{alpha:false});x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
async function useFile(file,name){
  const seq=++S.seq;setStatus('loading','busy');
  try{const image=await readImage(file);if(seq!==S.seq)return;
    S.image=image;S.imageId=null;S.fileName=name||file.name||'image.png';S.data=null;S.step=null;
    $('#fileTitle').textContent=S.fileName;$('#fileHint').textContent=t('change');$('#thumb').style.backgroundImage=`url(${image})`;$('#thumb').innerHTML='';
    showSource();analyze(true)}
  catch(e){if(seq===S.seq)setStatus('failed','error',{m:e.message})}}
function showSource(){$('#welcome').classList.add('hidden');const img=new Image();img.onload=()=>{$('#sheet').style.setProperty('--ar',img.width/img.height)};img.src=S.image;
  if(!S.data){$('#imgBottom').src=S.image;$('#imgTop').removeAttribute('src');$('#sheet').classList.remove('hidden');$('#peel').classList.add('hidden');$$('.peel-label').forEach(x=>x.classList.add('hidden'))}}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f)useFile(f);e.target.value=''});
const drop=$('#drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,()=>drop.classList.remove('drag')));
drop.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)useFile(f)});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(!drop.contains(e.target)){e.preventDefault();const f=e.dataTransfer?.files[0];if(f)useFile(f)}});
document.addEventListener('paste',e=>{const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(item){const f=item.getAsFile();if(f)useFile(f,'pasted.png')}});
$('#sample').addEventListener('click',async()=>{const r=await fetch('/examples/hokusai-great-wave.jpg');const b=await r.blob();S.style='woodcut';renderOutputs();useFile(new File([b],'hokusai-great-wave.jpg',{type:b.type||'image/jpeg'}))});

/* ---------- analysis (automatic) ---------- */
function schedule(){renderThickness();renderOutputs();if(!S.image)return;clearTimeout(S.timer);S.timer=setTimeout(()=>analyze(false),380)}
async function analyze(fresh){
  clearTimeout(S.timer);const seq=++S.seq;S.busy=true;$('#stage').classList.add('busy');setStatus('working','busy');
  const body={config:config()};
  if(S.imageId&&!fresh)body.image_id=S.imageId;else body.image=S.image;
  try{let r=await post('/api/analyze',body);
    if(r.status===409){delete body.image_id;body.image=S.image;r=await post('/api/analyze',body)}
    const d=await r.json();if(seq!==S.seq)return;if(!r.ok)throw Error(d.error||r.statusText);
    S.data=d;S.imageId=d.image_id;S.step=null;S.mesh3d=null;setStatus('ready');
    renderFacts();renderFiles();renderStep();renderView()}
  catch(e){if(seq===S.seq)setStatus('failed','error',{m:e.message})}
  finally{if(seq===S.seq){S.busy=false;$('#stage').classList.remove('busy')}}}
const post=(url,body)=>fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

$$('#styles .style').forEach(b=>b.addEventListener('click',()=>{S.style=b.dataset.style;schedule()}));
$('#styles').addEventListener('keydown',e=>{const k=['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].indexOf(e.key);if(k<0)return;e.preventDefault();
  const list=$$('#styles .style'),i=list.findIndex(b=>b.dataset.style===S.style),n=list[(i+(k<2?1:-1)+list.length)%list.length];S.style=n.dataset.style;n.focus();schedule()});
['colors','trap','pitch','detail','contrast'].forEach(id=>$('#'+id).addEventListener('input',()=>{renderOutputs();schedule()}));
['width','height','base','relief'].forEach(id=>$('#'+id).addEventListener('input',()=>{const w=num('width'),h=num('height');if(w>=20&&w<=256&&h>=20&&h<=256)schedule();else renderThickness()}));
['nozzle','layer','bed','mirror','kento','frame','invert'].forEach(id=>$('#'+id).addEventListener('change',schedule));
const syncTestPlate=()=>{const q=new URLSearchParams({nozzle:$('#nozzle').value,layer:$('#layer').value,base:$('#base').value,relief:$('#relief').value});$('#testPlate').href='/api/testplate.zip?'+q};
['nozzle','layer','base','relief'].forEach(id=>$('#'+id).addEventListener('input',syncTestPlate));syncTestPlate();
$('#swap').addEventListener('click',()=>{const w=$('#width').value;$('#width').value=$('#height').value;$('#height').value=w;schedule()});
$$('#sizes button').forEach(b=>b.addEventListener('click',()=>{$('#width').value=b.dataset.w;$('#height').value=b.dataset.h;schedule()}));

/* ---------- results ---------- */
const icon='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1.5v7M3 5.5l3 3 3-3M1.5 10.5h9"/></svg>';
const link=(href,label,name)=>`<a class="dl" href="${href}" download${name?`="${name}"`:''}>${icon}${label}</a>`;
function renderFiles(){const d=S.data;if(!d)return;$('#filesEmpty').classList.add('hidden');const box=$('#files');box.classList.remove('hidden');
  const multi=d.layers.length>1;
  box.innerHTML=d.layers.map((l,i)=>`<div class="plate-row"><span class="swatch" style="background:${multi?l.color:'var(--ai)'}"></span><span class="name">${multi?`${t('fPlate')} ${i+1}`:t('fPlate')}</span><div class="links">${link(l['3mf'],l.tiles>1?`3MF ×${l.tiles}`:'3MF')}${link(l.stl,l.tiles>1?`STL ×${l.tiles}`:'STL')}${link(l.svg,'SVG')}</div></div>`).join('')
   +`<div class="plate-row all"><div class="links">${link(d.bundle,t('zip'))}${link(d.previews.proof,'PNG',`proof-preview.png`)}${d.guide?link(d.guide,t('guide'),'PRINT_GUIDE.md'):''}</div></div>`}
function renderStep(){const d=S.data;$('#stepBox').classList.toggle('hidden',!d);if(!d)return;const st=S.step,btn=$('#makeStep');
  const skipped=(d.metrics.notes||[]).filter(n=>n.code==='step_skipped');
  btn.disabled=!!st&&st.state!=='error';btn.classList.toggle('hidden',!!st&&st.state==='done');btn.innerHTML=st&&st.state==='running'?`<i class="spinner"></i><span>${t('stepBusy')}</span>`:`<span>${t('makeStep')}</span>`;
  $('#stepHint').textContent=st&&st.state==='error'?t('failed',{m:st.message}):st&&st.state==='done'?t('stepDone'):skipped.length?skipped.map(n=>t('stepSkip',{p:n.layer})).join(' / '):t('stepHint');
  $('#stepHint').style.color=st&&st.state==='error'?'var(--beni)':'';
  $('#stepFiles').innerHTML=st&&st.state==='done'?st.files.filter(f=>/\.step$/i.test(f.name)).map(f=>{const m=f.name.match(/_plate_(\d+)\.step$/i);return link(f.url,m?`STEP ${m[1]}`:'STEP')})
    .join(''):'';$('#stepFiles').style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:8px'}
$('#makeStep').addEventListener('click',async()=>{const d=S.data;if(!d)return;const job=d.job_id;S.step={state:'running'};renderStep();
  try{const r=await post('/api/export',{job_id:job});const j=await r.json();if(!r.ok)throw Error(j.error);poll(job)}catch(e){S.step={state:'error',message:e.message};renderStep()}});
async function poll(job){if(!S.data||S.data.job_id!==job)return;
  try{const r=await fetch('/api/export/'+job),j=await r.json();if(!S.data||S.data.job_id!==job)return;
    if(j.state==='done'){S.step={state:'done',files:j.files};renderStep();return}
    if(j.state==='error')throw Error(j.message);if(j.state==='idle')throw Error('expired');
    setTimeout(()=>poll(job),1000)}catch(e){S.step={state:'error',message:e.message};renderStep()}}

function renderFacts(){const d=S.data;if(!d){$('#facts').innerHTML='';return}const m=d.metrics;
  const fact=(k,v)=>`<span>${t(k)}<b>${v}</b></span>`;
  const notes=(m.notes||[]).map(n=>`<div class="note">${escapeHtml(t('n_'+n.code,{l:n.layer==='ink'?t('fPlate'):(n.layer||'').replace('plate_',t('fPlate')+' '),n:(n.n||0).toLocaleString()}))}</div>`).join('');
  $('#facts').innerHTML=fact('fPlate',`${m.plate_mm[0]} × ${m.plate_mm[1]} mm`)+fact('fHeight',`${m.total_height_mm.toFixed(1)} mm`)
    +(d.layers.length>1?fact('fPlates',d.layers.length):'')+fact('fCurves',m.total_bezier_segments.toLocaleString())
    +(m.registration_marks?fact('fKento',t('on')):'')+(m.tiles&&m.tiles.count>1?fact('fTiles',m.tiles.cols+' × '+m.tiles.rows):'')+(d.layers.length>1&&m.trap_mm?fact('fTrap',m.trap_mm.toFixed(2)+' mm'):'')+(notes?`<div class="notes">${notes}</div>`:'')}
const escapeHtml=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- views ---------- */
$$('#views button').forEach(b=>b.addEventListener('click',()=>{S.view=b.dataset.view;renderView()}));
function renderView(){const d=S.data;
  $$('#views button').forEach(b=>{b.disabled=!d;b.setAttribute('aria-selected',!!d&&b.dataset.view===S.view)});
  const is3d=!!d&&S.view==='plate3d';$('#plate3d').classList.toggle('hidden',!is3d);$('#tools3d').classList.toggle('hidden',!is3d);
  if(!d){$('#caption').textContent='';return}
  $('#welcome').classList.add('hidden');$('#sheet').classList.toggle('hidden',is3d);
  const [w,h]=d.metrics.plate_mm;$('#sheet').style.setProperty('--ar',w/h);
  const compare=S.view==='compare';$('#peel').classList.toggle('hidden',!compare);$$('.peel-label').forEach(x=>x.classList.toggle('hidden',!compare));
  if(compare){$('#imgBottom').src=d.previews.source;$('#imgTop').src=d.previews.proof;$('#labelL').textContent=t('left');$('#labelR').textContent=t('right');setPeel(S.peel)}
  else if(!is3d){$('#imgBottom').src=d.previews[S.view==='curves'?'curves':'corrected'];$('#imgTop').removeAttribute('src')}
  $('#caption').textContent=compare?t('cCompare'):is3d?t('c3d'):S.view==='curves'?t('cCurves'):'';
  if(is3d)open3d()}
function setPeel(v){S.peel=Math.max(0,Math.min(100,v));$('#sheet').style.setProperty('--peel',S.peel+'%');$('#peel').setAttribute('aria-valuenow',Math.round(S.peel))}
(()=>{const p=$('#peel');let drag=false;
  const move=e=>{const r=$('#sheet').getBoundingClientRect();setPeel((e.clientX-r.left)/r.width*100)};
  p.addEventListener('pointerdown',e=>{drag=true;p.setPointerCapture(e.pointerId);move(e)});
  p.addEventListener('pointermove',e=>drag&&move(e));p.addEventListener('pointerup',()=>drag=false);
  $('#sheet').addEventListener('click',e=>{if(S.view==='compare'&&e.target.tagName==='IMG')move(e)});
  p.addEventListener('keydown',e=>{const s=e.shiftKey?10:2;if(e.key==='ArrowLeft'){setPeel(S.peel-s);e.preventDefault()}if(e.key==='ArrowRight'){setPeel(S.peel+s);e.preventDefault()}})})();

/* ---------- 3D plate (WebGL 2, offline) ---------- */
const V3={gl:null,prog:null,mesh:null,layer:0,ex:3,raf:0,cam:{theta:-1.25,phi:.82,dist:1,auto:true}};
const VS=`#version 300 es
in vec3 p;in vec3 n;uniform mat4 mvp;uniform float zs;uniform float top;out vec3 vn;out float h;out vec3 wp;
void main(){vec3 q=vec3(p.xy,p.z*zs);wp=q;vn=normalize(vec3(n.xy,n.z/zs));h=p.z/top;gl_Position=mvp*vec4(q,1.);}`;
const FS=`#version 300 es
precision highp float;in vec3 vn;in float h;in vec3 wp;uniform vec3 ink;uniform vec3 eye;uniform float baseFrac;out vec4 o;
void main(){vec3 N=normalize(vn);if(!gl_FrontFacing)N=-N;vec3 L=normalize(vec3(-.45,.55,.9));float d=max(dot(N,L),0.);float hemi=.5+.5*N.z;
vec3 V=normalize(eye-wp);float s=pow(max(dot(reflect(-L,N),V),0.),40.)*.3;vec3 pla=vec3(.92,.92,.9);float t=smoothstep(baseFrac+.02,baseFrac+.25,h);
vec3 c=mix(pla,ink,t*.85);float lines=.975+.025*step(.5,fract(wp.z*5.));o=vec4((c*(.3+.3*hemi+.6*d)+s)*lines,1.);}`;
function gl3(){if(V3.gl)return true;const c=$('#plate3d'),gl=c.getContext('webgl2',{antialias:true});if(!gl)return false;
  const sh=(ty,src)=>{const s=gl.createShader(ty);gl.shaderSource(s,src);gl.compileShader(s);return s};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
  V3.gl=gl;V3.prog=pr;orbit(c);new ResizeObserver(req).observe(c);return true}
function open3d(){if(!gl3()){setStatus('noWebgl','error');return}tools3d();
  const d=S.data,l=d.layers[Math.min(V3.layer,d.layers.length-1)],key=d.job_id+':'+l.name;
  if(S.mesh3d===key){req();return}const img=new Image();img.onload=()=>{if(S.data!==d)return;build3d(img,d.metrics);S.mesh3d=key;req()};img.src=l.height}
function tools3d(){const d=S.data,box=$('#tools3d');const multi=d.layers.length>1;
  box.innerHTML=(multi?d.layers.map((l,i)=>`<button aria-pressed="${i===V3.layer}" data-i="${i}"><i style="background:${l.color}"></i>${t('fPlate')} ${i+1}</button>`).join(''):'')
   +`<button data-x aria-pressed="${V3.ex===1}">${t('x1')}</button>`;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{V3.layer=Number(b.dataset.i);S.mesh3d=null;open3d()});
  box.querySelector('[data-x]').onclick=()=>{V3.ex=V3.ex===1?3:1;tools3d();req()}}
function build3d(img,m){const gl=V3.gl,W=m.plate_mm[0],H=m.plate_mm[1],base=m.base_height_mm,rel=m.relief_height_mm;
  const sc=Math.min(1,440/Math.max(img.width,img.height)),nx=Math.max(8,Math.round(img.width*sc)),ny=Math.max(8,Math.round(img.height*sc));
  const c=document.createElement('canvas');c.width=nx;c.height=ny;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,nx,ny);const px=x.getImageData(0,0,nx,ny).data;
  const gx=nx+2,gy=ny+2,pos=new Float32Array(gx*gy*3),nor=new Float32Array(gx*gy*3);
  const zAt=(i,j)=>(i<=0||j<=0||i>=gx-1||j>=gy-1)?0:base+rel*px[((j-1)*nx+(i-1))*4]/255;
  const xAt=i=>Math.min(Math.max(i-1,0),nx-1)/(nx-1)*W,yAt=j=>H-Math.min(Math.max(j-1,0),ny-1)/(ny-1)*H;
  for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){const k=(j*gx+i)*3;pos[k]=xAt(i);pos[k+1]=yAt(j);pos[k+2]=zAt(i,j)}
  for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){const k=(j*gx+i)*3,l=Math.max(i-1,0),r=Math.min(i+1,gx-1),dn=Math.max(j-1,0),u=Math.min(j+1,gy-1);
    const dzx=(pos[(j*gx+r)*3+2]-pos[(j*gx+l)*3+2])/Math.max(1e-4,pos[(j*gx+r)*3]-pos[(j*gx+l)*3]);
    const dzy=(pos[(u*gx+i)*3+2]-pos[(dn*gx+i)*3+2])/Math.min(-1e-4,pos[(u*gx+i)*3+1]-pos[(dn*gx+i)*3+1]);
    let a=-dzx,b=dzy,cz=1;if(i===0){a=-1;b=0;cz=.15}if(i===gx-1){a=1;b=0;cz=.15}if(j===0){b=1;cz=.15}if(j===gy-1){b=-1;cz=.15}
    const len=Math.hypot(a,b,cz);nor[k]=a/len;nor[k+1]=b/len;nor[k+2]=cz/len}
  const idx=new Uint32Array((gx-1)*(gy-1)*6);let q=0;for(let j=0;j<gy-1;j++)for(let i=0;i<gx-1;i++){const a=j*gx+i,b=a+1,cc=a+gx,dd=cc+1;idx.set([a,cc,b,b,cc,dd],q);q+=6}
  if(V3.mesh){gl.deleteVertexArray(V3.mesh.vao);V3.mesh.bufs.forEach(b=>gl.deleteBuffer(b))}
  const vao=gl.createVertexArray();gl.bindVertexArray(vao);const bufs=[];
  const at=(name,data)=>{const b=gl.createBuffer();bufs.push(b);gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);const loc=gl.getAttribLocation(V3.prog,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)};
  at('p',pos);at('n',nor);const ib=gl.createBuffer();bufs.push(ib);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  V3.mesh={vao,bufs,count:idx.length,W,H,top:base+rel,baseFrac:base/(base+rel)};V3.cam.dist=Math.hypot(W,H)*1.75}
function matrix(){const c=$('#plate3d'),m=V3.mesh,cam=V3.cam,asp=c.clientWidth/Math.max(1,c.clientHeight),f=1/Math.tan(.31),n=1,fa=3000;
  const P=[f/asp,0,0,0,0,f,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0],tx=m.W/2,ty=m.H/2;
  const e=[tx+cam.dist*Math.sin(cam.phi)*Math.cos(cam.theta),ty+cam.dist*Math.sin(cam.phi)*Math.sin(cam.theta),cam.dist*Math.cos(cam.phi)];
  const sub=(a,b)=>a.map((v,i)=>v-b[i]),nm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)},cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dt=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const z=nm(sub(e,[tx,ty,0])),x=nm(cr([0,0,1],z)),y=cr(z,x),Vm=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dt(x,e),-dt(y,e),-dt(z,e),1];
  const M=new Float32Array(16);for(let cc=0;cc<4;cc++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=P[k*4+r]*Vm[cc*4+k];M[cc*4+r]=s}return{M,e}}
function draw(){V3.raf=0;const c=$('#plate3d'),gl=V3.gl,m=V3.mesh;if(!m||c.classList.contains('hidden'))return;
  const dpr=Math.min(2,devicePixelRatio||1),w=Math.round(c.clientWidth*dpr),h=Math.round(c.clientHeight*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.useProgram(V3.prog);
  const {M,e}=matrix(),u=n=>gl.getUniformLocation(V3.prog,n),d=S.data,l=d.layers[Math.min(V3.layer,d.layers.length-1)];
  const hex=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16)/255);
  gl.uniformMatrix4fv(u('mvp'),false,M);gl.uniform1f(u('zs'),V3.ex);gl.uniform1f(u('top'),m.top);gl.uniform1f(u('baseFrac'),m.baseFrac);
  gl.uniform3fv(u('ink'),d.layers.length>1?hex(l.color):[.11,.25,.43]);gl.uniform3fv(u('eye'),e);
  gl.bindVertexArray(m.vao);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_INT,0);
  if(V3.cam.auto&&!matchMedia('(prefers-reduced-motion: reduce)').matches){V3.cam.theta+=.003;req()}}
function req(){if(!V3.raf)V3.raf=requestAnimationFrame(draw)}
function orbit(c){const pts=new Map();let pinch=0;const cam=V3.cam;
  c.addEventListener('pointerdown',e=>{cam.auto=false;c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])});
  c.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const [x0,y0]=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===1){cam.theta-=(e.clientX-x0)*.008;cam.phi=Math.min(1.45,Math.max(.05,cam.phi-(e.clientY-y0)*.008))}
    else if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)cam.dist=Math.min(1500,Math.max(20,cam.dist*pinch/d));pinch=d}req()});
  const up=e=>{pts.delete(e.pointerId);pinch=0};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  c.addEventListener('wheel',e=>{e.preventDefault();cam.auto=false;cam.dist=Math.min(1500,Math.max(20,cam.dist*Math.exp(e.deltaY*.0012)));req()},{passive:false})}

/* ---------- start ---------- */
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>applyLang(b.dataset.lang)));
applyLang(lang);
