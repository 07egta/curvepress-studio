[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curvepress-studio"
version = "0.3.2"
description = "Images to curve-based, physically printable relief plates"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CurvePress contributors"}]
keywords = ["3d-printing", "step", "relief", "bezier", "woodcut", "halftone"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "Pillow>=10.2,<13",
  "contourpy>=1.2,<2",
  "mapbox_earcut>=1.0,<3",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
cad = ["cadquery-ocp==7.8.1.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
curvepress = "curvepress.cli:main"

[project.urls]
Homepage = "https://github.com/07egta/curvepress-studio"
Documentation = "https://github.com/07egta/curvepress-studio/tree/main/docs"
Issues = "https://github.com/07egta/curvepress-studio/issues"

[tool.setuptools.packages.find]
include = ["curvepress*"]

[tool.setuptools.package-data]
curvepress = ["static/*.html", "static/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
per-file-ignores = {"curvepress/exporter.py" = ["F401"]}


